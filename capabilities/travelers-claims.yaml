naftiko: 1.0.0-alpha2
info:
  label: Travelers API — Claims
  description: 'Travelers API — Claims. 4 operations. Lead operation: List Claims. Self-contained Naftiko capability covering
    one Travelers business surface.'
  tags:
  - Travelers
  - Claims
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAVELERS_API_KEY: TRAVELERS_API_KEY
capability:
  consumes:
  - type: http
    namespace: travelers-claims
    baseUri: https://api.travelers.com/v1
    description: Travelers API — Claims business capability. Self-contained, no shared references.
    resources:
    - name: claims
      path: /claims
      operations:
      - name: listclaims
        method: GET
        description: List Claims
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by claim status
        - name: policy_type
          in: query
          type: string
          description: Filter by insurance policy type
        - name: start_date
          in: query
          type: string
          description: Filter claims from this date (YYYY-MM-DD)
        - name: end_date
          in: query
          type: string
          description: Filter claims to this date (YYYY-MM-DD)
        - name: limit
          in: query
          type: integer
          description: Maximum number of claims to return
      - name: reportclaim
        method: POST
        description: Report Claim
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: claims-claim_number
      path: /claims/{claim_number}
      operations:
      - name: getclaim
        method: GET
        description: Get Claim
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: claim_number
          in: path
          type: string
          description: The claim number assigned by Travelers
          required: true
    - name: claims-claim_number-documents
      path: /claims/{claim_number}/documents
      operations:
      - name: uploadclaimdocument
        method: POST
        description: Upload Claim Document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: claim_number
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TRAVELERS_API_KEY}}'
  exposes:
  - type: rest
    namespace: travelers-claims-rest
    port: 8080
    description: REST adapter for Travelers API — Claims. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/claims
      name: claims
      description: REST surface for claims.
      operations:
      - method: GET
        name: listclaims
        description: List Claims
        call: travelers-claims.listclaims
        with:
          status: rest.status
          policy_type: rest.policy_type
          start_date: rest.start_date
          end_date: rest.end_date
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: reportclaim
        description: Report Claim
        call: travelers-claims.reportclaim
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/claims/{claim-number}
      name: claims-claim-number
      description: REST surface for claims-claim_number.
      operations:
      - method: GET
        name: getclaim
        description: Get Claim
        call: travelers-claims.getclaim
        with:
          claim_number: rest.claim_number
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/claims/{claim-number}/documents
      name: claims-claim-number-documents
      description: REST surface for claims-claim_number-documents.
      operations:
      - method: POST
        name: uploadclaimdocument
        description: Upload Claim Document
        call: travelers-claims.uploadclaimdocument
        with:
          claim_number: rest.claim_number
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: travelers-claims-mcp
    port: 9090
    transport: http
    description: MCP adapter for Travelers API — Claims. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-claims
      description: List Claims
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: travelers-claims.listclaims
      with:
        status: tools.status
        policy_type: tools.policy_type
        start_date: tools.start_date
        end_date: tools.end_date
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: report-claim
      description: Report Claim
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: travelers-claims.reportclaim
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-claim
      description: Get Claim
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: travelers-claims.getclaim
      with:
        claim_number: tools.claim_number
      outputParameters:
      - type: object
        mapping: $.
    - name: upload-claim-document
      description: Upload Claim Document
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: travelers-claims.uploadclaimdocument
      with:
        claim_number: tools.claim_number
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
