naftiko: "1.0.0-alpha1"

info:
  label: "Travelers Insurance API"
  description: "Business insurance claims reporting, commercial quoting, and policy management APIs from Travelers, a Fortune 500 property casualty insurer."
  tags:
    - Insurance
    - Property Casualty
    - Claims
    - Commercial Insurance
    - Fintech
    - Fortune 500
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRAVELERS_CLIENT_ID: TRAVELERS_CLIENT_ID
      TRAVELERS_CLIENT_SECRET: TRAVELERS_CLIENT_SECRET

capability:
  consumes:
    - type: http
      namespace: travelers
      baseUri: https://api.travelers.com/v1
      description: "Travelers business insurance claims, quoting, and policy APIs."
      authentication:
        type: bearer
        token: "{{TRAVELERS_OAUTH_TOKEN}}"
      resources:
        - name: claims
          path: /claims
          description: "Business insurance claims management"
          operations:
            - name: list-claims
              method: GET
              description: "List business insurance claims"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by claim status"
                - name: policy_type
                  in: query
                  type: string
                  required: false
                  description: "Filter by policy type"
                - name: start_date
                  in: query
                  type: string
                  required: false
                  description: "Filter from date"
                - name: end_date
                  in: query
                  type: string
                  required: false
                  description: "Filter to date"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: report-claim
              method: POST
              description: "Submit a new business insurance claim"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  policy_number: "{{tools.policy_number}}"
                  policy_type: "{{tools.policy_type}}"
                  loss_date: "{{tools.loss_date}}"
                  description: "{{tools.description}}"

        - name: claims-by-number
          path: /claims/{claim_number}
          description: "Individual claim operations"
          operations:
            - name: get-claim
              method: GET
              description: "Get details of a specific claim"
              inputParameters:
                - name: claim_number
                  in: path
                  type: string
                  required: true
                  description: "Claim number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: quotes
          path: /quotes
          description: "Commercial insurance quoting"
          operations:
            - name: request-quote
              method: POST
              description: "Request a commercial insurance quote"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  product_type: "{{tools.product_type}}"
                  business_info: "{{tools.business_info}}"
                  effective_date: "{{tools.effective_date}}"

        - name: quotes-by-id
          path: /quotes/{quote_id}
          description: "Individual quote retrieval"
          operations:
            - name: get-quote
              method: GET
              description: "Retrieve a previously generated quote"
              inputParameters:
                - name: quote_id
                  in: path
                  type: string
                  required: true
                  description: "Quote ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: policies
          path: /policies
          description: "Policy information"
          operations:
            - name: list-policies
              method: GET
              description: "List commercial insurance policies"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by policy status"
                - name: policy_type
                  in: query
                  type: string
                  required: false
                  description: "Filter by policy type"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: policies-by-number
          path: /policies/{policy_number}
          description: "Individual policy retrieval"
          operations:
            - name: get-policy
              method: GET
              description: "Get details of a specific policy"
              inputParameters:
                - name: policy_number
                  in: path
                  type: string
                  required: true
                  description: "Policy number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: travelers-rest
      resources:
        - path: /v1/claims
          name: claims
          operations:
            - method: GET
              name: list-claims
              description: "List claims"
              call: "travelers.list-claims"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: report-claim
              description: "Report a claim"
              call: "travelers.report-claim"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/policies
          name: policies
          operations:
            - method: GET
              name: list-policies
              description: "List policies"
              call: "travelers.list-policies"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: travelers-mcp
      transport: http
      tools:
        - name: list-claims
          description: "List business insurance claims"
          hints:
            readOnly: true
            openWorld: false
          call: "travelers.list-claims"
          outputParameters:
            - type: object
              mapping: "$."
        - name: report-claim
          description: "Submit a new business insurance claim"
          hints:
            readOnly: false
            openWorld: false
          call: "travelers.report-claim"
          with:
            policy_number: "tools.policy_number"
            policy_type: "tools.policy_type"
            loss_date: "tools.loss_date"
            description: "tools.description"
          outputParameters:
            - type: object
              mapping: "$."
        - name: request-quote
          description: "Request a commercial insurance quote"
          hints:
            readOnly: false
            openWorld: false
          call: "travelers.request-quote"
          with:
            product_type: "tools.product_type"
            business_info: "tools.business_info"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-policies
          description: "List commercial insurance policies"
          hints:
            readOnly: true
            openWorld: false
          call: "travelers.list-policies"
          outputParameters:
            - type: object
              mapping: "$."
