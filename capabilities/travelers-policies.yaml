naftiko: 1.0.0-alpha2
info:
  label: Travelers API — Policies
  description: 'Travelers API — Policies. 2 operations. Lead operation: List Policies. Self-contained Naftiko capability covering
    one Travelers business surface.'
  tags:
  - Travelers
  - Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRAVELERS_API_KEY: TRAVELERS_API_KEY
capability:
  consumes:
  - type: http
    namespace: travelers-policies
    baseUri: https://api.travelers.com/v1
    description: Travelers API — Policies business capability. Self-contained, no shared references.
    resources:
    - name: policies
      path: /policies
      operations:
      - name: listpolicies
        method: GET
        description: List Policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by policy status
        - name: policy_type
          in: query
          type: string
          description: Filter by policy type
    - name: policies-policy_number
      path: /policies/{policy_number}
      operations:
      - name: getpolicy
        method: GET
        description: Get Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: policy_number
          in: path
          type: string
          description: The policy number
          required: true
    authentication:
      type: bearer
      token: '{{env.TRAVELERS_API_KEY}}'
  exposes:
  - type: rest
    namespace: travelers-policies-rest
    port: 8080
    description: REST adapter for Travelers API — Policies. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/policies
      name: policies
      description: REST surface for policies.
      operations:
      - method: GET
        name: listpolicies
        description: List Policies
        call: travelers-policies.listpolicies
        with:
          status: rest.status
          policy_type: rest.policy_type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/policies/{policy-number}
      name: policies-policy-number
      description: REST surface for policies-policy_number.
      operations:
      - method: GET
        name: getpolicy
        description: Get Policy
        call: travelers-policies.getpolicy
        with:
          policy_number: rest.policy_number
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: travelers-policies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Travelers API — Policies. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-policies
      description: List Policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: travelers-policies.listpolicies
      with:
        status: tools.status
        policy_type: tools.policy_type
      outputParameters:
      - type: object
        mapping: $.
    - name: get-policy
      description: Get Policy
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: travelers-policies.getpolicy
      with:
        policy_number: tools.policy_number
      outputParameters:
      - type: object
        mapping: $.
