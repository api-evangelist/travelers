  - FOCUS
description: FinOps shape for Travelers cannot be reconciled from public sources; the developer portal
  and pricing are gated and access is governed by partner agreements.
sources:
  - https://developer.travelers.com
notes: Public pricing, billing, and usage telemetry surfaces are not disclosed. FOCUS mappings and
  meters can only be confirmed against an executed Travelers partner / integration agreement.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: The Travelers Indemnity Company
serviceCategory: Insurance
billingModel:
  pricingCategory: Contract / Negotiated
  billingFrequency: Per-Contract
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Travelers API
  ServiceCategory: Insurance
  ProviderName: Travelers
  PublisherName: The Travelers Indemnity Company
  InvoiceIssuerName: The Travelers Indemnity Company
  BillingCurrency: USD
meters:
  - name: contract_fees
    unit: varies
    aggregation: sum
    dimensions:
      - contract
principles:
  - name: Visibility
    description: Consumption data is exchanged via the Travelers partner channel rather than a public
      usage API; visibility depends on the reporting clauses of the integration agreement.
  - name: Allocation
    description: Allocate costs to the line of business consuming Travelers integrations (claims,
      quoting, policy servicing) using the contract identifier as the primary tag.
  - name: Optimization
    description: Optimization levers are negotiated (volume tiers, term length, multi-product bundling)
      rather than surfaced through self-serve tooling.
  - name: Accountability
    description: Procurement and the integrating insurance line of business co-own the contract; renewals
      and usage true-ups are governed by the partner agreement.
