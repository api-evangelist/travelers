aid: travelers
name: Travelers
description: >-
  Travelers is one of the largest property casualty insurance companies in the United States and a Fortune 500 company.
  Through their developer portal, Travelers provides APIs for business insurance claim reporting, commercial quoting,
  and policy management to enable agents, brokers, and partners to programmatically manage insurance workflows.
